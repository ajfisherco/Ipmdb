<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAD — Dollar a Day</title>
<meta name="description" content="DAD — Dollar a Day. One dollar a day. One community at a time. A simple contribution stream for housing action, tracked publicly through IPM.db.">
<meta http-equiv="refresh" content="0; url=/dad/">
<link rel="canonical" href="/dad/">
<style>
:root{--green:#06452f;--orange:#ff6a00;--cream:#fff8e9;--ink:#07111f}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#fffdf5,var(--cream));color:var(--ink);text-align:center;padding:28px}.card{max-width:620px;background:white;border-radius:28px;padding:34px;box-shadow:0 22px 70px rgba(6,69,47,.14);border:1px solid rgba(6,69,47,.14)}h1{font-size:clamp(2.4rem,8vw,4.8rem);line-height:.92;letter-spacing:-.06em;margin:0 0 14px;color:var(--green);font-family:Georgia,"Times New Roman",serif}.orange{color:var(--orange)}p{font-size:1.15rem;line-height:1.45;margin:0 0 22px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:64px;padding:16px 26px;border-radius:18px;background:linear-gradient(135deg,var(--orange),#ff8d17);color:white;text-decoration:none;font-weight:1000;font-size:1.2rem}
</style>
<script>window.location.replace('/dad/');</script>
</head>
<body>
  <main class="card">
    <h1>One dollar a day.<br>One <span class="orange">community</span> at a time.</h1>
    <p>The DAD page has moved to the updated homepage.</p>
    <a class="btn" href="/dad/">Open DAD</a>
  </main>
</body>
</html>
