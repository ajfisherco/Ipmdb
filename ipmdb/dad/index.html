<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAD | Dollar A Day | End Homelessness</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f4f4;
}

.wrap{
  max-width:760px;
  margin:auto;
  background:#087d25;
  color:white;
  text-align:center;
  padding:32px 22px;
  min-height:100vh;
}

h1{
  font-size:72px;
  line-height:.9;
  margin:20px 0 0;
  letter-spacing:.02em;
}

h2{
  font-size:34px;
  margin:0 0 18px;
}

.mission{
  font-size:22px;
  margin:10px 0 34px;
  font-weight:900;
  line-height:1.3;
}

.btn{
  display:block;
  background:white;
  color:#087d25;
  text-decoration:none;
  font-weight:900;
  font-size:32px;
  border-radius:999px;
  padding:22px;
  margin:22px auto;
  max-width:620px;
  border:0;
}

.qr{
  display:block;
  width:260px;
  max-width:70%;
  background:white;
  border-radius:24px;
  padding:16px;
  margin:20px auto;
}

.row{
  display:flex;
  gap:18px;
  justify-content:center;
  align-items:stretch;
}

.row .btn{
  width:45%;
  font-size:28px;
  margin:22px 0;
}

.note{
  font-size:16px;
  line-height:1.45;
  margin:10px auto 22px;
  max-width:620px;
  opacity:.95;
}

.footer{
  background:#111;
  color:white;
  padding:22px;
  font-weight:900;
  margin:28px -22px -32px;
}

@media(max-width:640px){
  h1{
    font-size:60px;
  }

  h2{
    font-size:30px;
  }

  .btn{
    font-size:28px;
    padding:20px;
  }

  .row{
    display:block;
  }

  .row .btn{
    width:100%;
    margin:18px auto;
  }
}
</style>
</head>

<body>
<div class="wrap">

  <h1>DAD</h1>

  <h2>Dollar A Day</h2>

  <p class="mission">
    $1/DAY = ONE GOAL<br>
    END HOMELESSNESS
  </p>

  <a class="btn" href="https://square.link/u/O5gSk7XM">
    Contribute
  </a>

  <img
    class="qr"
    src="https://quickchart.io/qr?text=https%3A%2F%2Fsquare.link%2Fu%2FO5gSk7XM&size=360"
    alt="DAD QR Code">

  <div class="row">
    <a class="btn" href="https://square.link/u/O5gSk7XM">
      Card
    </a>

    <a
      class="btn"
      href="#"
      onclick="navigator.clipboard.writeText('dad@ajfisherco.com');alert('dad@ajfisherco.com copied');return false;">
      E-transfer
    </a>
  </div>

  <p class="note">
    Contributions support the Dollar a Day pilot and related public-interest work tracked through IPMdb.
  </p>

  <a class="btn" href="/ipmdb/">
    View Public Ledger
  </a>

  <div class="footer">
    Alexander John Fisher &amp; Co.
  </div>

</div>
</body>
</html>
