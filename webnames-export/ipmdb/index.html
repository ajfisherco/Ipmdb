<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>IPMdb.ai | DAD</title>
  <meta name="description" content="IPMdb turns ideas into owned, trackable assets. DAD is Dollar A Day: one goal, end homelessness." />
  <link rel="stylesheet" href="./css/styles.css" />
  <link rel="stylesheet" href="./css/desktop.css" />
  <link rel="stylesheet" href="./css/mobile.css" />
</head>
<body>
  <main id="top" class="app-shell" aria-label="IPMdb and Dollar A Day launch application">
    <section class="panel panel-ipm" aria-labelledby="ipm-title">
      <nav class="panel-nav" aria-label="IPMdb navigation">
        <a href="#dad" class="pill">DAD →</a>
        <a href="https://github.com/ajfisherco/Ipmdb/issues" class="pill ghost" target="_blank" rel="noopener">Ledger</a>
      </nav>

      <div class="panel-card">
        <header class="brand-block">
          <p class="kicker">IPMdb.ai</p>
          <h1 id="ipm-title">Ideas 2 Assets</h1>
          <p class="tagline">The future lives here.</p>
        </header>

        <form id="ideaForm" class="stack" novalidate>
          <label>
            <span>Idea title</span>
            <input id="ideaTitle" name="ideaTitle" type="text" maxlength="80" placeholder="YOUR IDEA IN ONE WORD" autocomplete="off" required />
          </label>

          <label>
            <span>Email</span>
            <input id="ideaEmail" name="ideaEmail" type="email" placeholder="YOUR EMAIL" autocomplete="email" required />
          </label>

          <label>
            <span>How did you get here?</span>
            <select id="ideaSource" name="ideaSource" required>
              <option value="">HOW DID YOU GET HERE?</option>
              <option value="Google">Google</option>
              <option value="Friend">Friend</option>
              <option value="QR Code">QR Code</option>
              <option value="DAD">DAD</option>
              <option value="Facebook">Facebook</option>
              <option value="Truth Social">Truth Social</option>
              <option value="AJF">AJF</option>
              <option value="SQ">SQ</option>
              <option value="Other">Other</option>
            </select>
          </label>

          <label id="sourceOtherWrap" class="hidden">
            <span>Specific source</span>
            <input id="sourceOther" name="sourceOther" type="text" placeholder="CUSTOM ENTRY" />
          </label>

          <label>
            <span>Description</span>
            <textarea id="ideaDescription" name="ideaDescription" rows="5" placeholder="Describe your idea..."></textarea>
          </label>

          <button class="primary-button" type="submit">LOCK IDEA</button>
          <p id="ideaReceipt" class="receipt hidden" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>

    <section id="dad" class="panel panel-dad" aria-labelledby="dad-title">
      <nav class="panel-nav" aria-label="DAD navigation">
        <a href="#top" class="pill">← IPMdb.ai</a>
        <button id="copyEtransfer" class="pill ghost" type="button">Copy e-transfer</button>
      </nav>

      <div class="panel-card">
        <header class="brand-block">
          <p class="kicker">DAD</p>
          <h2 id="dad-title">Dollar A Day</h2>
          <p class="tagline">$1/day = 1 goal. End homelessness.</p>
        </header>

        <form id="dadForm" class="stack" novalidate>
          <div class="choice-grid" role="radiogroup" aria-label="Contribution amount">
            <label class="choice"><input type="radio" name="dadAmount" value="1" checked /><span>$1/day</span></label>
            <label class="choice"><input type="radio" name="dadAmount" value="365" /><span>$365/year</span></label>
          </div>

          <label>
            <span>Custom amount</span>
            <input id="dadCustom" name="dadCustom" type="number" min="1" step="1" placeholder="$ CUSTOM AMOUNT" />
          </label>

          <label>
            <span>Email</span>
            <input id="dadEmail" name="dadEmail" type="email" placeholder="YOUR EMAIL" autocomplete="email" />
          </label>

          <div class="button-grid">
            <button class="primary-button" type="submit" data-method="card">PAY BY CARD</button>
            <button class="primary-button" type="button" id="dadEtransfer">E-TRANSFER</button>
            <button class="primary-button" type="button" id="dadQr">QR CODE</button>
          </div>

          <p id="dadReceipt" class="receipt hidden" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <script src="./js/asset.js"></script>
  <script src="./js/ipmdb.js"></script>
  <script src="./js/dad.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
