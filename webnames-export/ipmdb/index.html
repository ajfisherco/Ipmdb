<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IPMdb.ai | DAD</title>
<meta name="description" content="IPMdb.ai Ideas 2 Assets and DAD Dollar A Day.">
<style>
:root{--blue:#60a5fa;--blue2:#2563eb;--green:#86efac;--green2:#22c55e;--ink:#020617;--white:#fff}*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:var(--ink);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{overflow:hidden}#ajf{width:100vw;height:100svh;overflow:hidden;background:var(--ink)}#top{height:10svh;min-height:76px;display:flex;align-items:center;justify-content:center;gap:22px;background:var(--ink);font-weight:1000}#top a{text-decoration:none;font-size:clamp(34px,9vw,66px);line-height:1}#ipmlink{color:var(--blue)}#dadlink{color:var(--green)}#pages{height:90svh;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth}.page{min-width:100vw;height:90svh;scroll-snap-align:start;overflow-y:auto;padding:18px;display:flex;align-items:center;justify-content:center}.card{width:100%;max-width:560px;border-radius:34px;padding:22px;display:flex;flex-direction:column;gap:12px;background:#030712}.ipm{border:3px solid var(--blue2);box-shadow:0 0 60px rgba(37,99,235,.45)}.dad{border:3px solid var(--green2);box-shadow:0 0 60px rgba(34,197,94,.4)}input,select,textarea{width:100%;border:0;outline:0;border-radius:24px;padding:22px;font-size:clamp(18px,5vw,30px);font-weight:1000;background:#fff;color:var(--ink)}textarea{height:28svh;min-height:190px;resize:none}button,a.btn{width:100%;border:0;border-radius:999px;padding:24px 18px;font-size:clamp(22px,6vw,36px);font-weight:1000;text-align:center;text-decoration:none;cursor:pointer}.blue{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff}.green{background:linear-gradient(135deg,var(--green),var(--green2));color:#031108}#qr{width:min(74vw,320px);height:min(74vw,320px);display:block;margin:10px auto;padding:14px;background:#fff;border-radius:28px}.receipt{border-radius:22px;padding:16px;background:rgba(255,255,255,.11);font-weight:1000;text-align:center}.hidden{display:none!important}@media(min-width:800px){#pages{overflow:hidden}.page{min-width:50vw}}
</style>
</head>
<body>
<div id="ajf">
<nav id="top">
<a id="ipmlink" href="#ipm">IPMdb</a>
<a id="dadlink" href="#dad">← DAD</a>
</nav>
<div id="pages">
<section id="ipm" class="page">
<form id="ideaForm" class="card ipm">
<input id="ideaTitle" name="title" placeholder="IDEA TITLE" autocomplete="off" required>
<input id="ideaEmail" name="email" type="email" placeholder="YOUR EMAIL" autocomplete="email" required>
<select id="ideaSource" name="source" required>
<option value="">HOW DID YOU GET HERE?</option>
<option value="Search">Google / Search</option>
<option value="Friend">Friend</option>
<option value="QR Code">QR Code</option>
<option value="Dollar A Day">DAD</option>
<option value="Facebook">Facebook</option>
<option value="Truth Social">Truth Social</option>
<option value="AJF">AJF</option>
<option value="SQ">SQ</option>
<option value="Other">Other</option>
</select>
<input id="sourceOther" name="sourceOther" class="hidden" placeholder="WHO OR WHAT SPECIFICALLY?">
<textarea id="ideaDescription" name="description" placeholder="YOUR IDEA" required></textarea>
<button class="blue" type="submit">LOCK IDEA</button>
<p id="ideaReceipt" class="receipt hidden" role="status" aria-live="polite"></p>
</form>
</section>
<section id="dad" class="page">
<div class="card dad">
<a class="btn green" href="https://square.link/u/O5gSk7XM" target="_blank" rel="noopener">$1/DAY</a>
<img id="qr" alt="QR CODE" src="https://quickchart.io/qr?text=https%3A%2F%2Fsquare.link%2Fu%2FO5gSk7XM&size=460&margin=1">
<a class="btn green" href="https://square.link/u/O5gSk7XM" target="_blank" rel="noopener">PAY BY CARD</a>
</div>
</section>
</div>
</div>
<script>
(() => {
  const form = document.querySelector('#ideaForm');
  const receipt = document.querySelector('#ideaReceipt');
  const source = document.querySelector('#ideaSource');
  const other = document.querySelector('#sourceOther');

  source.addEventListener('change', () => {
    const show = ['Other','Friend','QR Code'].includes(source.value);
    other.classList.toggle('hidden', !show);
    other.placeholder = source.value === 'Friend' ? 'NAME OF FRIEND' : source.value === 'QR Code' ? 'AJF / DAD / EVENT' : 'WHO OR WHAT SPECIFICALLY?';
    if (!show) other.value = '';
  });

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const button = form.querySelector('button');
    const payload = {
      title: form.title.value.trim(),
      email: form.email.value.trim(),
      source: source.value === 'Other' ? other.value.trim() : source.value,
      description: form.description.value.trim()
    };
    if (!payload.title || !payload.email || !payload.source) {
      receipt.textContent = 'Complete idea title, email, and source.';
      receipt.classList.remove('hidden');
      return;
    }
    try {
      button.disabled = true;
      receipt.textContent = 'Locking idea...';
      receipt.classList.remove('hidden');
      const response = await fetch('./api/submit.php', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      });
      const result = await response.json();
      if (!response.ok || !result.ok) throw new Error(result.error || 'Submission failed.');
      receipt.textContent = 'Idea locked. Asset ID: ' + result.asset_id + '.';
      form.reset();
      other.classList.add('hidden');
    } catch (error) {
      receipt.textContent = error.message || 'Submission could not be completed.';
    } finally {
      button.disabled = false;
    }
  });
})();
</script>
</body>
</html>
